version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - laravel

  webserver:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    ports:
      - "9450:5432"
    environment:
      POSTGRES_DB: AVAN
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 132rockgas
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - laravel

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8003:1025"
      - "8001:8025"

networks:
  laravel:

volumes:
  pgdata:
